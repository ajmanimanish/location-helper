<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Help – Share Location</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0fdfa;
      padding: 20px;
      max-width: 480px;
      margin: auto;
    }

    h1 {
      color: #065f46;
      text-align: center;
    }

    label {
      font-weight: bold;
      margin-top: 15px;
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    button {
      margin-top: 25px;
      width: 100%;
      font-size: 20px;
      padding: 16px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    .suggestions {
      background: white;
      border: 1px solid #ccc;
      border-radius: 8px;
      max-height: 150px;
      overflow-y: auto;
    }

    .suggestion-item {
      padding: 10px;
      cursor: pointer;
    }

    .suggestion-item:hover {
      background: #e6fffa;
    }

    .note {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>🚖 Book a Taxi</h1>

  <!-- DESTINATION -->
  <label>Destination (required)</label>
  <input
    type="text"
    id="destination"
    placeholder="Hospital, airport, street name…"
    oninput="searchDestination()"
  />
  <div id="suggestions" class="suggestions"></div>

  <!-- PICKUP DATE -->
  <label>Pickup Date (optional)</label>
  <input type="date" id="pickupDate" />

  <!-- PICKUP TIME -->
  <label>Pickup Time (optional)</label>
  <input type="time" id="pickupTime" />

  <button onclick="sendTaxiRequest()">📍 SHARE & REQUEST TAXI</button>

  <p class="note">
    Location is shared only when you press the button.
  </p>

<script>
  let selectedDestination = "";

  function searchDestination() {
    const query = document.getElementById("destination").value;
    if (query.length < 3) {
      document.getElementById("suggestions").innerHTML = "";
      return;
    }

   fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&countrycodes=in&addressdetails=1&limit=5`)
      .then(res => res.json())
      .then(data => {
        const suggestions = document.getElementById("suggestions");
        suggestions.innerHTML = "";

        data.slice(0, 5).forEach(place => {
          const div = document.createElement("div");
          div.className = "suggestion-item";
          div.innerText = place.display_name;
          div.onclick = () => {
            document.getElementById("destination").value = place.display_name;
            selectedDestination = place.display_name;
            suggestions.innerHTML = "";
          };
          suggestions.appendChild(div);
        });
      });
  }

  function sendTaxiRequest() {
    const destination =
      selectedDestination || document.getElementById("destination").value.trim();

    if (!destination) {
      alert("Please enter destination.");
      return;
    }

    const date = document.getElementById("pickupDate").value;
    const time = document.getElementById("pickupTime").value;

    let pickupText = "NOW (ASAP)";
    if (date || time) {
      pickupText = `${date || "Today"} ${time || ""}`.trim();
    }

    if (!navigator.geolocation) {
      alert("Location not supported.");
      return;
    }

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const lat = pos.coords.latitude;
        const lon = pos.coords.longitude;
        const mapsLink = `https://maps.google.com/?q=${lat},${lon}`;

        const message = encodeURIComponent(
`🚖 Taxi Request – Confirmation Needed

📍 Pickup Location:
${mapsLink}

📍 Destination:
${destination}

⏰ Pickup:
${pickupText}

        const whatsappNumber = "917828893403";
        window.location.href = `https://wa.me/${whatsappNumber}?text=${message}`;
      },
      () => alert("Unable to fetch location.")
    );
  }
</script>

</body>
</html>
