<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Assistance</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: linear-gradient(180deg, #ecfeff, #f0fdfa);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .service-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      padding: 24px;
    }

    .service-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .service-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .service-title {
      font-size: 22px;
      font-weight: 600;
      color: #064e3b;
    }

    .service-subtitle {
      font-size: 14px;
      color: #555;
      margin-top: 4px;
    }

    .field {
      margin-bottom: 16px;
      text-align: left;
    }

    .field label {
      display: block;
      font-size: 14px;
      color: #064e3b;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #d1fae5;
      background: #f9fafb;
    }

    .primary-btn {
      width: 100%;
      margin-top: 10px;
      padding: 18px;
      font-size: 18px;
      font-weight: 600;
      background: #0f766e;
      color: #fff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }

    .primary-btn:active {
      background: #115e59;
    }

    .trust-footer {
      margin-top: 18px;
      font-size: 13px;
      color: #555;
      text-align: center;
    }

    .trust-footer span {
      display: block;
      margin-top: 4px;
    }
  </style>
</head>

<body>

  <div class="service-card">

    <!-- SERVICE HEADER -->
    <div class="service-header">
      <div class="service-icon">🚕</div>
      <div class="service-title">Taxi Assistance</div>
      <div class="service-subtitle">
        We help you book a cab safely
      </div>
    </div>

    <!-- INPUTS -->
    <div class="field">
      <label>Pickup Location</label>
      <input type="text" value="Current location will be shared" disabled>
    </div>

    <div class="field">
      <label>Destination *</label>
      <input type="text" id="destination" placeholder="Enter destination">
    </div>

    <div class="field">
      <label>Pickup Time (optional)</label>
      <input type="datetime-local" id="pickupTime">
    </div>

    <!-- ACTION -->
    <button class="primary-btn" onclick="requestTaxi()">
      Request Taxi
    </button>

    <!-- TRUST -->
    <div class="trust-footer">
      🔒 Location shared only after confirmation
      <span>No app download required</span>
    </div>

  </div>

<script>
  function requestTaxi() {
    const destination = document.getElementById("destination").value.trim();
    const pickupTime = document.getElementById("pickupTime").value;

    if (!destination) {
      alert("Please enter destination");
      return;
    }

    if (!navigator.geolocation) {
      alert("Location not supported");
      return;
    }

    navigator.geolocation.getCurrentPosition(position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const mapsLink = `https://maps.google.com/?q=${lat},${lon}`;

      let message =
        `Hello,\n\nI need help booking a taxi.\n\n` +
        `📍 Pickup Location:\n${mapsLink}\n\n` +
        `🏁 Destination:\n${destination}\n`;

      if (pickupTime) {
        message += `\n⏰ Pickup Time:\n${pickupTime}\n`;
      }

      const encodedMessage = encodeURIComponent(message);

      const whatsappNumber = "917828893403"; // your number
      window.location.href = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

    }, () => {
      alert("Unable to fetch location");
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>

</body>
</html>
