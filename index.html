<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help – Share My Location</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f766e">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0fdfa;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      font-size: 26px;
      color: #065f46;
    }
    p {
      font-size: 18px;
      color: #064e3b;
      margin-bottom: 20px;
    }
    button {
      font-size: 22px;
      padding: 18px 26px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 90%;
      max-width: 320px;
    }
    button:active {
      background: #115e59;
    }
    input {
      font-size: 20px;
      padding: 14px;
      width: 90%;
      max-width: 320px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 15px;
    }
    .note {
      margin-top: 25px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

  <h1>Need Help Outside?</h1>
  <p>Press the button below to share your location.</p>

  <button onclick="shareLocation()">📍 SHARE MY LOCATION</button>

  <!-- Destination selection -->
  <div id="destinationBox" style="display:none; margin-top:30px;">
    <p>Where do you want to go?</p>

    <button onclick="sendWithDestination('Hospital')">🏥 Hospital</button><br><br>
    <button onclick="sendWithDestination('Home')">🏠 Home</button><br><br>
    <button onclick="sendWithDestination('Airport')">✈️ Airport</button><br><br>

    <button onclick="showOtherDestination()">📍 Other destination</button>
  </div>

  <!-- Google Autocomplete input -->
  <div id="otherBox" style="display:none; margin-top:25px;">
    <p>Type destination address</p>
    <input
      type="text"
      id="destinationInput"
      placeholder="House no, street, area, city"
    >
    <br><br>
    <button onclick="sendOtherDestination()">Send</button>
  </div>

  <p class="note">
    We only access your location when you press the button.
  </p>

  <script>
    let currentMapsLink = "";
    let selectedAddress = "";

    function shareLocation() {
      if (!navigator.geolocation) {
        alert("Location not supported.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          currentMapsLink = `https://maps.google.com/?q=${lat},${lon}`;
          document.getElementById("destinationBox").style.display = "block";
        },
        () => alert("Unable to get location.")
      );
    }

    function sendWithDestination(destination) {
      const message = encodeURIComponent(
        `Hello, I need help booking a taxi.\n\nPickup location:\n${currentMapsLink}\n\nDestination:\n${destination}`
      );

      const whatsappNumber = "917828893403";
      window.location.href = `https://wa.me/${whatsappNumber}?text=${message}`;
    }

    function showOtherDestination() {
      document.getElementById("otherBox").style.display = "block";
    }

    function sendOtherDestination() {
      const input = document.getElementById("destinationInput").value.trim();
      if (!input) {
        alert("Please enter destination.");
        return;
      }
      sendWithDestination(input);
    }

    // Google Places Autocomplete
    function initAutocomplete() {
      const input = document.getElementById("destinationInput");
      const autocomplete = new google.maps.places.Autocomplete(input, {
        types: ["geocode"],
      });

      autocomplete.addListener("place_changed", () => {
        const place = autocomplete.getPlace();
        if (place.formatted_address) {
          input.value = place.formatted_address;
        }
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>

  <!-- Google Maps API -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyD6ZxieC6Q2sx963MS_voRTTJkZ1ooyeZU&libraries=places&callback=initAutocomplete"
    async
    defer
  ></script>

</body>
</html>
