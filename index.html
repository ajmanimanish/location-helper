<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taxi Help – Share Location</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0fdfa;
      padding: 20px;
      max-width: 480px;
      margin: auto;
    }

    h1 {
      color: #065f46;
      text-align: center;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 25px;
      width: 100%;
      font-size: 20px;
      padding: 16px;
      background: #0f766e;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    button:active {
      background: #115e59;
    }

    .note {
      margin-top: 15px;
      font-size: 14px;
      color: #555;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>🚖 Book a Taxi</h1>

  <!-- DESTINATION (MANDATORY) -->
  <label for="destination">Destination (required)</label>
  <input
    type="text"
    id="destination"
    placeholder="Hospital, Airport, Street name..."
    required
  />

  <!-- PICKUP TIME (OPTIONAL) -->
  <label for="pickupTime">Pickup Time (optional)</label>
  <input
    type="time"
    id="pickupTime"
  />

  <button onclick="sendTaxiRequest()">📍 SHARE & REQUEST TAXI</button>

  <p class="note">
    Your location is shared only after you press the button.
  </p>

  <script>
    function sendTaxiRequest() {
      const destination = document.getElementById("destination").value.trim();
      const pickupTimeInput = document.getElementById("pickupTime").value;

      // Destination is mandatory
      if (!destination) {
        alert("Please enter destination.");
        return;
      }

      // Pickup time logic
      const pickupTime = pickupTimeInput ? pickupTimeInput : "NOW (ASAP)";

      if (!navigator.geolocation) {
        alert("Location not supported on this device.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;

          const mapsLink = `https://maps.google.com/?q=${lat},${lon}`;

          // FINAL WHATSAPP MESSAGE
          const message = encodeURIComponent(
`🚖 Taxi Request – Confirmation Needed

📍 Pickup Location:
${mapsLink}

📍 Destination:
${destination}

⏰ Pickup Time:
${pickupTime}

👉 Please reply:
CONFIRM / CHANGE TIME / CANCEL`
          );

          // 🔴 YOUR WHATSAPP NUMBER (with country code, no +)
          const whatsappNumber = "917828893403";

          const whatsappURL = `https://wa.me/${whatsappNumber}?text=${message}`;
          window.location.href = whatsappURL;
        },
        () => {
          alert("Unable to fetch location. Please try again.");
        }
      );
    }
  </script>

</body>
</html>
